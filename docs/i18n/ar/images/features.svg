    <circle cx="633" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="621" y="210" text-anchor="end">selectInstance() اختيار عبر موازنة التحميل</text>
    <circle cx="633" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="621" y="232" style="font-size:11.6px" text-anchor="end">RoundRobin / Random / استراتيجية مخصصة</text>
    <circle cx="633" cy="250" r="2.5" fill="#8B8FE8"/><text class="cl" x="621" y="254" text-anchor="end">watch() استدعاء عند دخول/خروج نسخة</text>
    <circle cx="633" cy="272" r="2.5" fill="#8B8FE8"/><text class="cl" x="621" y="276" text-anchor="end">stop() إيقاف سلس عبر العمليات</text>

    <rect x="24" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="330" y="124" width="4" height="20" rx="2" fill="#4CC9F0"/>
