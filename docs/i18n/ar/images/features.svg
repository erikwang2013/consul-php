    <circle cx="954" cy="838" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="842" text-anchor="end">ThinkPHP：ConsulService + app(&apos;consul&apos;)</text>
    <circle cx="954" cy="860" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="864" style="font-size:9.2px" text-anchor="end">واجهة API متطابقة، والفرق في طريقة الحصول على $client</text>

    <rect x="345" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="651" y="712" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="ct" x="637" y="728" text-anchor="end">تصميم الموثوقية</text>
    <text class="capi" x="637" y="746" text-anchor="end">Exception · Logger · Cache · Event · Promise</text>
    <circle cx="633" cy="772" r="2.5" fill="#35D07F"/><text class="cl" x="621" y="776" style="font-size:10.6px" text-anchor="end">نظام استثناءات موحّد، وكلها ترث ConsulException</text>
    <circle cx="633" cy="794" r="2.5" fill="#35D07F"/><text class="cl" x="621" y="798" style="font-size:11.2px" text-anchor="end">سجلات PSR-3، و NullLogger كاحتياطي تلقائي</text>
    <circle cx="633" cy="816" r="2.5" fill="#35D07F"/><text class="cl" x="621" y="820" text-anchor="end">أحداث PSR-14: ConfigChangedEvent</text>
    <circle cx="633" cy="838" r="2.5" fill="#35D07F"/><text class="cl" x="621" y="842" text-anchor="end">ConsulAsyncClient + تنفيذ Promise المؤجَّل</text>
    <circle cx="633" cy="860" r="2.5" fill="#35D07F"/><text class="cl" x="621" y="864" style="font-size:11.2px" text-anchor="end">توحيد أخطاء الاتصال/الفك إلى ClientException</text>

    <rect x="24" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="330" y="712" width="4" height="20" rx="2" fill="#4CC9F0"/>
