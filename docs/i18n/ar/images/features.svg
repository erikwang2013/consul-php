    <circle cx="954" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="942" y="428" text-anchor="end">set / delete كتابة وحذف</text>
    <circle cx="954" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="942" y="450" text-anchor="end">تسريع تلقائي بعد حقن تخزين PSR-16</text>
    <circle cx="954" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="942" y="472" style="font-size:10.8px" text-anchor="end">قناة Watcher تتجاوز التخزين وتقرأ القيم الحية</text>

    <rect x="345" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="651" y="320" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="ct" x="637" y="336" text-anchor="end">التحديث اللحظي للإعدادات</text>
    <text class="capi" x="637" y="354" text-anchor="end">Config\Watcher · ConfigChangedEvent</text>
    <circle cx="633" cy="380" r="2.5" fill="#E03875"/><text class="cl" x="621" y="384" text-anchor="end">blocking query + X-Consul-Index</text>
    <circle cx="633" cy="402" r="2.5" fill="#E03875"/><text class="cl" x="621" y="406" style="font-size:10px" text-anchor="end">تحويل تلقائي إلى استقصاء دوري عند خطأ الشبكة</text>
    <circle cx="633" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="621" y="428" style="font-size:8.6px" text-anchor="end">استعادة الاستقصاء الطويل تلقائيًا بعد 5 نجاحات متتالية</text>
    <circle cx="633" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="621" y="450" text-anchor="end">قناتان: استدعاء onChange + أحداث PSR-14</text>
    <circle cx="633" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="621" y="472" text-anchor="end">setBlockingWait / setPollInterval / stop</text>

