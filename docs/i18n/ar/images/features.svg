    <text class="capi" x="958" y="746" text-anchor="end">src/Integration</text>
    <circle cx="954" cy="772" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="776" style="font-size:11.5px" text-anchor="end">Laravel: اكتشاف تلقائي + Facade + Artisan</text>
