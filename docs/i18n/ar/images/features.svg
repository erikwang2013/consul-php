  <rect width="1000" height="970" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="976" y="48" text-anchor="end">تصميم وظائف consul-php</text>
    <text class="sub" x="976" y="74" text-anchor="end">18 وحدة API + 3 تغليفات + دعم 4 أطر: خريطة القدرات والمداخل</text>
