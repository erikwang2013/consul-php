    <circle cx="954" cy="184" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="188" text-anchor="end">register(name, address, port, options)</text>
    <circle cx="954" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="210" text-anchor="end">أربعة فحوص سلامة: TTL / HTTP / TCP / gRPC</text>
    <circle cx="954" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="942" y="232" text-anchor="end">heartbeat / heartbeatFail إرسال النبضة</text>
