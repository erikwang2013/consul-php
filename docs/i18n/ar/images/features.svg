    <circle cx="312" cy="272" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="276" text-anchor="end">إدارة شجرة الإعدادات بالجملة عبر بادئة</text>
    <rect x="666" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
