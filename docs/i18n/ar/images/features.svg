    <text class="capi" x="316" y="746" text-anchor="end">composer require erikwang2013/consul-php</text>
    <circle cx="312" cy="772" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="776" style="font-size:11.7px" text-anchor="end">PHP 8.0+، الحزمة الأساسية بلا اعتماد على أطر</text>
    <circle cx="312" cy="794" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="798" text-anchor="end">تغطية كاملة لـ Consul HTTP API v1</text>
    <circle cx="312" cy="816" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="820" text-anchor="end">18 وحدة API + 3 تغليفات عالية المستوى</text>
    <circle cx="312" cy="838" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="842" style="font-size:8.9px" text-anchor="end">يعتمد على واجهات PSR فقط، وعميل HTTP قابل للاستبدال</text>
    <circle cx="312" cy="860" r="2.5" fill="#4CC9F0"/><text class="cl" x="300" y="864" text-anchor="end">594 اختبار وحدة · PHPStan L5</text>
