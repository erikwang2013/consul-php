    <circle cx="954" cy="642" r="2.5" fill="#F5A623"/><text class="cl" x="942" y="646" style="font-size:10.8px" text-anchor="end">سلوك delete: تحرير الموارد تلقائيًا عند الانتهاء</text>
    <circle cx="954" cy="664" r="2.5" fill="#F5A623"/><text class="cl" x="942" y="668" style="font-size:9.8px" text-anchor="end">انتهاء الجلسة يعني انتهاء القفل، دون نبضة إضافية</text>

