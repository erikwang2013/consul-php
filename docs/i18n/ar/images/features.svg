    <text class="capi" x="316" y="354" text-anchor="end">Api\Health</text>
    <circle cx="312" cy="380" r="2.5" fill="#35D07F"/><text class="cl" x="300" y="384" text-anchor="end">service(name, [&apos;passing&apos; =&gt; true])</text>
