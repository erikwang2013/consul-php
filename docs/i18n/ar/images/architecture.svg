<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-label="مخطط تصميم معمارية consul-php">
  <title>تصميم معمارية consul-php</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .gutter { font-size: 13px; font-weight: 600; fill: #9BA3FF; }
    .ct { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .cs { font-size: 11.5px; fill: #98A1B5; }
    .mini { font-size: 10.5px; fill: #A9B2C3; }
    .mini-mod { font-size: 9px; fill: #A9B2C3; }
    .band { font-size: 13px; font-weight: 600; fill: #E8ECF5; }
    .bands { font-size: 11px; fill: #98A1B5; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E83E6"/>
      <stop offset="1" stop-color="#E03875"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="990" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="956" y="48" text-anchor="end">تصميم معمارية consul-php</text>
    <text class="sub" x="956" y="74" text-anchor="end">اعتماديات طبقية: طبقة التطبيق → طبقة الدمج → العميل → التغليفات العليا → وحدات API → طبقة النقل → تجريدات PSR → Consul Agent</text>
    <text class="gutter" x="968" y="140" style="font-size:9.4px" text-anchor="end">طبقة التطبيق</text>
    <rect x="718" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="862" y="128" text-anchor="end">Laravel</text>
    <text class="cs" x="862" y="150" style="font-size:9.6px" text-anchor="end">اكتشاف تلقائي + Facade</text>
    <rect x="549" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="693" y="128" text-anchor="end">Hyperf</text>
    <text class="cs" x="693" y="150" style="font-size:8.7px" text-anchor="end">coroutine + حقن بالتعليقات</text>
    <rect x="380" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="524" y="128" text-anchor="end">webman</text>
    <text class="cs" x="524" y="150" style="font-size:9.7px" text-anchor="end">تثبيت الإضافة تلقائيًا</text>
    <rect x="211" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="355" y="128" text-anchor="end">ThinkPHP</text>
    <text class="cs" x="355" y="150" text-anchor="end">ربط Service</text>
    <rect x="42" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="186" y="128" text-anchor="end">PHP خالص</text>
    <text class="cs" x="186" y="150" text-anchor="end">new ConsulClient()</text>

    <path d="M 466 176L 460 187L 454 176" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="234" text-anchor="end">طبقة الدمج</text>
    <rect x="718" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="862" y="222" text-anchor="end">ServiceProvider</text>
    <text class="cs" x="862" y="244" text-anchor="end">Facade · consul:watch</text>
    <rect x="549" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="693" y="222" text-anchor="end">ConfigProvider</text>
    <text class="cs" x="693" y="244" text-anchor="end">مصنع عميل coroutine</text>
    <rect x="380" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="524" y="222" text-anchor="end">Webman Install</text>
    <text class="cs" x="524" y="244" style="font-size:11.2px" text-anchor="end">نسخ الإعدادات + Worker</text>
    <rect x="211" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="355" y="222" text-anchor="end">ConsulService</text>
    <text class="cs" x="355" y="244" text-anchor="end">app(&apos;consul&apos;)</text>
    <rect x="42" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="186" y="222" text-anchor="end">ClientFactory</text>
    <text class="cs" x="186" y="244" style="font-size:8.6px" text-anchor="end">تجميع اعتماديات PSR تلقائيًا</text>

    <path d="M 466 270L 460 281L 454 270" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="328" text-anchor="end">العميل</text>
    <rect x="465" y="284" width="413" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="862" y="316" text-anchor="end">ConsulClient · المدخل المتزامن</text>
    <text class="cs" x="862" y="338" text-anchor="end">__get توزيع الخصائص السحرية → $client-&gt;kv / health / catalog …</text>
    <rect x="44" y="284" width="413" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="441" y="316" text-anchor="end">ConsulAsyncClient · تنفيذ Promise المؤجَّل</text>
    <text class="cs" x="441" y="338" text-anchor="end">wrap(fn() =&gt; ...)-&gt;then(...)-&gt;catch(...)-&gt;wait()</text>

    <path d="M 466 364L 460 375L 454 364" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="430" text-anchor="end">التغليفات</text>
    <rect x="606" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="862" y="408" text-anchor="end">Service\Registry</text>
    <text class="cs" x="862" y="430" text-anchor="end">register · heartbeat</text>
    <text class="cs" x="862" y="450" text-anchor="end">heartbeatFail · deregister</text>
    <rect x="325" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="581" y="408" text-anchor="end">Service\Discovery</text>
    <text class="cs" x="581" y="430" text-anchor="end">healthyInstances · watch</text>
    <text class="cs" x="581" y="450" text-anchor="end">LoadBalancer: RoundRobin / Random</text>
    <rect x="44" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="300" y="408" text-anchor="end">Config\ConfigCenter</text>
    <text class="cs" x="300" y="430" text-anchor="end">get · namespace · set · delete</text>
    <text class="cs" x="300" y="450" text-anchor="end">watch() → Config\Watcher تحديث لحظي</text>

    <path d="M 466 474L 460 485L 454 474" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="536" text-anchor="end">وحدات API</text>
    <rect x="793" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="836" y="511" text-anchor="middle">Agent</text>
    <rect x="700" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="743" y="511" text-anchor="middle">Catalog</text>
    <rect x="607" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="650" y="511" text-anchor="middle">Health</text>
    <rect x="514" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="557" y="511" text-anchor="middle">Kv</text>
    <rect x="421" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="464" y="511" text-anchor="middle">Session</text>
    <rect x="328" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="371" y="511" text-anchor="middle">Acl</text>
    <rect x="235" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="278" y="511" text-anchor="middle">Event</text>
    <rect x="142" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="185" y="511" text-anchor="middle">Status</text>
    <rect x="49" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="92" y="511" text-anchor="middle">Coordinate</text>
    <rect x="793" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="836" y="553" text-anchor="middle">Operator</text>
    <rect x="700" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="743" y="553" text-anchor="middle">Snapshot</text>
    <rect x="607" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="650" y="553" text-anchor="middle">Txn</text>
    <rect x="514" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="557" y="553" text-anchor="middle">ConfigEntry</text>
    <rect x="421" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="464" y="553" text-anchor="middle">Connect</text>
    <rect x="328" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="371" y="553" text-anchor="middle">Query</text>
    <rect x="235" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="278" y="553" text-anchor="middle">Peering</text>
    <rect x="142" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="185" y="553" text-anchor="middle">DiscoveryChain</text>
    <rect x="49" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini-mod" x="92" y="553" text-anchor="middle">ExportedService</text>

    <path d="M 466 578L 460 589L 454 578" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="640" style="font-size:12.7px" text-anchor="end">طبقة النقل</text>
    <rect x="358" y="592" width="520" height="86" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="862" y="622" text-anchor="end">TransportInterface ← Psr18Transport</text>
    <text class="cs" x="862" y="644" text-anchor="end">get / put / post / delete · getRaw / putRaw · getWithHeaders</text>
    <text class="cs" x="862" y="664" text-anchor="end">حقن X-Consul-Token · فحص رمز الحالة · فك JSON · تحويل الاستثناءات</text>
    <rect x="44" y="592" width="306" height="86" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="334" y="622" text-anchor="end">التقاط ترويسات الاستجابة</text>
    <text class="cs" x="334" y="644" text-anchor="end">getWithHeaders() يُظهر</text>
    <text class="cs" x="334" y="664" text-anchor="end">X-Consul-Index → مؤشر blocking query</text>

    <path d="M 466 682L 460 693L 454 682" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="738" style="font-size:12px" text-anchor="end">تجريدات PSR</text>
    <rect x="718" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="862" y="728" text-anchor="end">PSR-18</text>
    <text class="cs" x="862" y="750" text-anchor="end">HTTP Client</text>
    <rect x="549" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="693" y="728" text-anchor="end">PSR-17</text>
    <text class="cs" x="693" y="750" style="font-size:10.6px" text-anchor="end">Request / Stream Factory</text>
    <rect x="380" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="524" y="728" text-anchor="end">PSR-16</text>
    <text class="cs" x="524" y="750" text-anchor="end">Cache (اختياري)</text>
    <rect x="211" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="355" y="728" text-anchor="end">PSR-3</text>
    <text class="cs" x="355" y="750" text-anchor="end">Logger (اختياري)</text>
    <rect x="42" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="186" y="728" text-anchor="end">PSR-14</text>
    <text class="cs" x="186" y="750" text-anchor="end">EventDispatcher</text>

    <path d="M 466 776L 460 787L 454 776" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="968" y="830" style="font-size:10.5px" text-anchor="end">خلفية العنقود</text>
    <rect x="44" y="790" width="834" height="72" rx="14" fill="#141826" stroke="#41476B"/>
    <rect x="872" y="790" width="6" height="72" rx="3" fill="url(#accent)"/>
    <text class="ct" x="852" y="822" text-anchor="end">Consul Agent · HTTP API v1　/agent　/catalog　/health　/kv　/session　/acl　/operator</text>
    <text class="cs" x="852" y="844" text-anchor="end">إعادة توجيه عبر Agent المحلي → عنقود Consul Server (إجماع Raft · مراكز بيانات متعددة · ACL)</text>
    <rect x="24" y="878" width="952" height="88" rx="16" fill="#131722" stroke="#262B3A"/>
    <rect x="952" y="890" width="4" height="18" rx="2" fill="#8B8FE8"/>
    <text class="band" x="942" y="904" text-anchor="end">الجوانب العرضية</text>
    <text class="bands" x="956" y="928" text-anchor="end">نظام الاستثناءات: ConsulException → Client / Server / Request(401·403·404)</text>
    <text class="bands" x="500" y="928" text-anchor="end">تخزين PSR-16: get() / namespace() تلقائيًا</text>
    <text class="bands" x="956" y="950" text-anchor="end">سجلات PSR-3: NullLogger احتياطي</text>
    <text class="bands" x="500" y="950" text-anchor="end">ضمان الجودة: PHP 8.0–8.4 · PHPStan L5 · 594 اختبار</text>
  </g>
</svg>
