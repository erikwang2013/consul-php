<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-label="consul-php 기능 설계도">
  <title>consul-php 기능 설계</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .ct { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .cl { font-size: 12px; fill: #A9B2C3; }
    .capi { font-size: 11px; fill: #6E768A; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="970" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="24" y="48" style="font-size:22.8px">consul-php 기능 설계</text>
    <text class="sub" x="24" y="74" style="font-size:10.3px">11개 API 모듈 + 3개 고수준 래퍼 + 4개 프레임워크 어댑터: 기능 맵과 대응 진입점</text>
    <rect x="24" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="124" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="42" y="140" style="font-size:10.1px">서비스 등록</text>
    <text class="capi" x="42" y="158">Service\Registry · Api\Agent</text>
    <circle cx="46" cy="184" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="188">register(name, address, port, options)</text>
    <circle cx="46" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="210" style="font-size:11.1px">TTL / HTTP / TCP / gRPC 4가지 헬스 체크</text>
    <circle cx="46" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="232" style="font-size:10.5px">heartbeat / heartbeatFail 하트비트 보고</text>
    <circle cx="46" cy="250" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="254" style="font-size:10.4px">deregister 우아한 종료</text>
    <circle cx="46" cy="272" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="276" style="font-size:8.6px">하트비트 타임아웃 시 정책에 따라 자동 등록 해제</text>

    <rect x="345" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="124" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="363" y="140" style="font-size:10.1px">서비스 디스커버리</text>
    <text class="capi" x="363" y="158">Service\Discovery · Service\LoadBalancer</text>
    <circle cx="367" cy="184" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="188" style="font-size:10.1px">healthyInstances() 정상 인스턴스 목록</text>
    <circle cx="367" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="210" style="font-size:10.6px">selectInstance() 로드 밸런싱 선택</text>
    <circle cx="367" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="232" style="font-size:10.2px">RoundRobin / Random / 사용자 정의 전략</text>
    <circle cx="367" cy="250" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="254" style="font-size:8.6px">watch() 인스턴스 등록·해제 콜백</text>
    <circle cx="367" cy="272" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="276" style="font-size:8.6px">stop() 프로세스 간 우아한 중지</text>

    <rect x="666" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="124" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="ct" x="684" y="140" style="font-size:11px">KV 저장소</text>
    <text class="capi" x="684" y="158">Api\Kv</text>
    <circle cx="688" cy="184" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="188" style="font-size:9.9px">put / get / delete 기본 읽기·쓰기</text>
    <circle cx="688" cy="206" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="210" style="font-size:10.5px">all() 재귀 나열 · keys() 구분자 기준 계층</text>
    <circle cx="688" cy="228" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="232" style="font-size:11.3px">acquire 파라미터로 Session 잠금</text>
    <circle cx="688" cy="250" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="254" style="font-size:10.5px">getRaw / putRaw 원시 바이트 채널</text>
    <circle cx="688" cy="272" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="276" style="font-size:8.6px">접두사 단위로 구성 트리 관리</text>
    <rect x="24" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="320" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="ct" x="42" y="336" style="font-size:12.3px">구성 센터</text>
    <text class="capi" x="42" y="354">Config\ConfigCenter</text>
    <circle cx="46" cy="380" r="2.5" fill="#E03875"/><text class="cl" x="58" y="384" style="font-size:10.4px">get(key, default) 단일 키 읽기</text>
    <circle cx="46" cy="402" r="2.5" fill="#E03875"/><text class="cl" x="58" y="406" style="font-size:9.8px">namespace(prefix) 구성 트리 전체 조회</text>
    <circle cx="46" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="58" y="428" style="font-size:11.5px">set / delete 쓰기와 삭제</text>
    <circle cx="46" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="58" y="450" style="font-size:10.7px">PSR-16 캐시 주입 시 자동 가속</text>
    <circle cx="46" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="58" y="472" style="font-size:8.6px">Watcher 채널은 캐시를 우회해 실시간 값을 조회</text>

    <rect x="345" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="320" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="ct" x="363" y="336" style="font-size:10.1px">구성 핫 리로드</text>
    <text class="capi" x="363" y="354">Config\Watcher · ConfigChangedEvent</text>
    <circle cx="367" cy="380" r="2.5" fill="#E03875"/><text class="cl" x="379" y="384">blocking query + X-Consul-Index</text>
    <circle cx="367" cy="402" r="2.5" fill="#E03875"/><text class="cl" x="379" y="406" style="font-size:8.6px">네트워크 오류 시 주기적 폴링으로 자동 강등</text>
    <circle cx="367" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="379" y="428" style="font-size:9.4px">5회 연속 성공 시 롱 폴링 자동 복구</text>
    <circle cx="367" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="379" y="450" style="font-size:10.2px">onChange 콜백 + PSR-14 이벤트 이중 채널</text>
    <circle cx="367" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="379" y="472">setBlockingWait / setPollInterval / stop</text>

    <rect x="666" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="320" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="ct" x="684" y="336" style="font-size:12.3px">헬스 체크</text>
    <text class="capi" x="684" y="354">Api\Health</text>
    <circle cx="688" cy="380" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="384">service(name, [&apos;passing&apos; =&gt; true])</text>
    <circle cx="688" cy="402" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="406" style="font-size:11px">node(name) 노드 전체 체크</text>
    <circle cx="688" cy="424" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="428" style="font-size:10.3px">checks(name) 서비스 전체 체크</text>
    <circle cx="688" cy="446" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="450">state() passing / warning / critical</text>
    <circle cx="688" cy="468" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="472" style="font-size:9.1px">TTL 하트비트와 외부 프로브 통합 뷰</text>
    <rect x="24" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="516" width="4" height="20" rx="2" fill="#F5A623"/>
    <text class="ct" x="42" y="532" style="font-size:12.1px">세션과 분산 잠금</text>
    <text class="capi" x="42" y="550">Api\Session + Api\Kv</text>
    <circle cx="46" cy="576" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="580">create(TTL · Behavior · LockDelay)</text>
    <circle cx="46" cy="598" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="602">renew / destroy / info / all / node</text>
    <circle cx="46" cy="620" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="624">Kv::put(..., [&apos;acquire&apos; =&gt; id]) 잠금</text>
    <circle cx="46" cy="642" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="646" style="font-size:9.3px">delete 동작: 만료 시 리소스 자동 해제</text>
    <circle cx="46" cy="664" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="668" style="font-size:8.6px">세션이 만료되면 잠금도 해제, 별도 하트비트 불필요</text>

    <rect x="345" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="516" width="4" height="20" rx="2" fill="#F5A623"/>
    <text class="ct" x="363" y="532">ACL 권한</text>
    <text class="capi" x="363" y="550">Api\Acl</text>
    <circle cx="367" cy="576" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="580">tokenCreate / Read / Update / Delete</text>
    <circle cx="367" cy="598" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="602" style="font-size:10.5px">policy* / role* / authMethod* 전체 세트</text>
    <circle cx="367" cy="620" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="624">login / logout / bootstrap</text>
    <circle cx="367" cy="642" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="646" style="font-size:9.9px">Token은 X-Consul-Token 헤더로 자동 주입</text>
    <circle cx="367" cy="664" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="668" style="font-size:10.5px">권한 부족 시 AccessDeniedException 발생</text>

    <rect x="666" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="516" width="4" height="20" rx="2" fill="#9BA3FF"/>
    <text class="ct" x="684" y="532" style="font-size:10.1px">클러스터 운영</text>
    <text class="capi" x="684" y="550">Status · Operator · Coordinate · Snapshot · Event</text>
    <circle cx="688" cy="576" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="580" style="font-size:9.9px">leader / peers 클러스터 상태</text>
    <circle cx="688" cy="598" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="602">raftConfig / autopilotConfig</text>
    <circle cx="688" cy="620" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="624">keyring list / install / use / remove</text>
    <circle cx="688" cy="642" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="646" style="font-size:10.5px">snapshot save / restore 바이너리 스냅샷</text>
    <circle cx="688" cy="664" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="668" style="font-size:10.3px">datacenters / nodes 네트워크 좌표</text>
    <rect x="24" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="712" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="42" y="728" style="font-size:10.1px">프레임워크 통합</text>
    <text class="capi" x="42" y="746">src/Integration</text>
    <circle cx="46" cy="772" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="776" style="font-size:11.6px">Laravel: 자동 발견 + Facade + Artisan</text>
    <circle cx="46" cy="794" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="798" style="font-size:10px">Hyperf: ConfigProvider + 코루틴 클라이언트</text>
    <circle cx="46" cy="816" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="820" style="font-size:10.4px">webman: 플러그인 설치 + onWorkerStart</text>
    <circle cx="46" cy="838" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="842" style="font-size:11.9px">ThinkPHP: ConsulService + app(&apos;consul&apos;)</text>
    <circle cx="46" cy="860" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="864" style="font-size:8.6px">API는 완전히 동일하고 $client를 얻는 방식만 다릅니다</text>

    <rect x="345" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="712" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="ct" x="363" y="728" style="font-size:12.6px">신뢰성 설계</text>
    <text class="capi" x="363" y="746">Exception · Logger · Cache · Event · Promise</text>
    <circle cx="367" cy="772" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="776" style="font-size:10.5px">통일된 예외 체계, 모두 ConsulException 상속</text>
    <circle cx="367" cy="794" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="798" style="font-size:11.5px">PSR-3 로그, NullLogger 자동 대체</text>
    <circle cx="367" cy="816" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="820" style="font-size:11.3px">PSR-14 이벤트: ConfigChangedEvent</text>
    <circle cx="367" cy="838" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="842" style="font-size:11.7px">ConsulAsyncClient + Promise 지연 실행</text>
    <circle cx="367" cy="860" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="864" style="font-size:9.9px">연결/디코딩 오류를 ClientException으로 정규화</text>

    <rect x="666" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="712" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="ct" x="684" y="728" style="font-size:12.3px">핵심 특성</text>
    <text class="capi" x="684" y="746">composer require erikwang2013/consul-php</text>
    <circle cx="688" cy="772" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="776" style="font-size:8.6px">PHP 8.0+, 코어 패키지 프레임워크 의존성 제로</text>
    <circle cx="688" cy="794" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="798" style="font-size:11.6px">Consul HTTP API v1 완전 지원</text>
    <circle cx="688" cy="816" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="820" style="font-size:11.3px">11개 API 모듈 + 3개 고수준 래퍼</text>
    <circle cx="688" cy="838" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="842" style="font-size:8.6px">PSR 인터페이스에만 의존, HTTP 클라이언트 교체 가능</text>
    <circle cx="688" cy="860" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="864" style="font-size:10.8px">309개 단위 테스트 · PHPStan L5</text>
    <rect x="24" y="886" width="952" height="56" rx="16" fill="#131722" stroke="#262B3A"/>
    <text class="ct" x="44" y="920" style="font-size:10.1px">하나의 API, 네 가지 프레임워크</text>
    <text class="cl" x="200" y="920" style="font-size:9.1px">Laravel · Hyperf · webman · ThinkPHP —— 코어 패키지는 의존성 제로, 프레임워크 어댑터 내장, composer require 한 번이면 사용 가능</text>
    <text class="capi" x="956" y="920" text-anchor="end">PHP 8.0 – 8.4</text>
  </g>
</svg>
