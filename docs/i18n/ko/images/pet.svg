<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="consul-php 프로젝트 펫 Consu">
  <title>Consu — erikwang2013/consul-php 프로젝트 펫</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .name { font-size: 44px; font-weight: 700; fill: #EDF0F7; letter-spacing: 1px; }
    .sub { font-size: 14px; fill: #8B93A7; }
    .label { font-size: 14px; fill: #C3C9D8; }
    .val { font-size: 12px; fill: #8B93A7; }
