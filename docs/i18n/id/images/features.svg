<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-label="Diagram desain fitur consul-php">
  <title>Desain fitur consul-php</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .ct { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .cl { font-size: 12px; fill: #A9B2C3; }
    .capi { font-size: 11px; fill: #6E768A; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="970" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="24" y="48" style="font-size:19.1px">Desain fitur consul-php</text>
    <text class="sub" x="24" y="74" style="font-size:9.4px">11 modul API + 3 wrapper + adaptasi 4 framework: peta kemampuan dan pintu masuknya</text>
    <rect x="24" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="124" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="42" y="140" style="font-size:10.1px">Registrasi layanan</text>
    <text class="capi" x="42" y="158">Service\Registry · Api\Agent</text>
    <circle cx="46" cy="184" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="188">register(name, address, port, options)</text>
    <circle cx="46" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="210" style="font-size:8.7px">Empat jenis health check TTL / HTTP / TCP / gRPC</text>
    <circle cx="46" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="232" style="font-size:11.4px">Pelaporan heartbeat / heartbeatFail</text>
    <circle cx="46" cy="250" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="254" style="font-size:8.6px">deregister: turun dengan rapi</text>
    <circle cx="46" cy="272" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="276" style="font-size:8.6px">Deregistrasi otomatis saat heartbeat timeout</text>

    <rect x="345" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="124" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="363" y="140" style="font-size:10.1px">Penemuan layanan</text>
    <text class="capi" x="363" y="158">Service\Discovery · Service\LoadBalancer</text>
    <circle cx="367" cy="184" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="188" style="font-size:8.8px">healthyInstances(): daftar instance sehat</text>
    <circle cx="367" cy="206" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="210" style="font-size:8.6px">selectInstance(): pemilihan titik load balancing</text>
    <circle cx="367" cy="228" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="232" style="font-size:10.1px">RoundRobin / Random / strategi kustom</text>
    <circle cx="367" cy="250" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="254" style="font-size:8.6px">watch(): callback instance naik/turun</text>
    <circle cx="367" cy="272" r="2.5" fill="#8B8FE8"/><text class="cl" x="379" y="276" style="font-size:8.6px">stop(): hentikan lintas proses dengan rapi</text>

    <rect x="666" y="100" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="124" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="ct" x="684" y="140" style="font-size:10.1px">Penyimpanan KV</text>
    <text class="capi" x="684" y="158">Api\Kv</text>
    <circle cx="688" cy="184" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="188" style="font-size:8.8px">put / get / delete: baca/tulis dasar</text>
    <circle cx="688" cy="206" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="210" style="font-size:8.6px">all() daftar rekursif · keys() hierarkis per pemisah</text>
    <circle cx="688" cy="228" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="232" style="font-size:8.6px">Parameter acquire dipakai bersama Session untuk mengunci</text>
    <circle cx="688" cy="250" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="254" style="font-size:9.8px">Kanal byte mentah getRaw / putRaw</text>
    <circle cx="688" cy="272" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="276" style="font-size:8.6px">Kelola pohon konfigurasi secara massal lewat prefiks</text>
    <rect x="24" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="320" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="ct" x="42" y="336" style="font-size:10.1px">Pusat konfigurasi</text>
    <text class="capi" x="42" y="354">Config\ConfigCenter</text>
    <circle cx="46" cy="380" r="2.5" fill="#E03875"/><text class="cl" x="58" y="384" style="font-size:9.2px">get(key, default) baca satu kunci</text>
    <circle cx="46" cy="402" r="2.5" fill="#E03875"/><text class="cl" x="58" y="406" style="font-size:8.6px">namespace(prefix): ambil seluruh pohon konfigurasi</text>
    <circle cx="46" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="58" y="428" style="font-size:8.6px">set / delete: menulis dan menghapus</text>
    <circle cx="46" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="58" y="450" style="font-size:8.6px">Otomatis dipercepat setelah cache PSR-16 disuntikkan</text>
    <circle cx="46" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="58" y="472" style="font-size:8.6px">Kanal Watcher melewati cache dan membaca nilai real-time</text>

    <rect x="345" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="320" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="ct" x="363" y="336" style="font-size:10.1px">Hot reload konfigurasi</text>
    <text class="capi" x="363" y="354">Config\Watcher · ConfigChangedEvent</text>
    <circle cx="367" cy="380" r="2.5" fill="#E03875"/><text class="cl" x="379" y="384">blocking query + X-Consul-Index</text>
    <circle cx="367" cy="402" r="2.5" fill="#E03875"/><text class="cl" x="379" y="406" style="font-size:8.6px">Saat jaringan bermasalah, fallback ke polling</text>
    <circle cx="367" cy="424" r="2.5" fill="#E03875"/><text class="cl" x="379" y="428" style="font-size:8.6px">Setelah 5 kali sukses, kembali ke long polling</text>
    <circle cx="367" cy="446" r="2.5" fill="#E03875"/><text class="cl" x="379" y="450" style="font-size:8.9px">Dua kanal: callback onChange + event PSR-14</text>
    <circle cx="367" cy="468" r="2.5" fill="#E03875"/><text class="cl" x="379" y="472">setBlockingWait / setPollInterval / stop</text>

    <rect x="666" y="296" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="320" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="ct" x="684" y="336" style="font-size:10.1px">Health check</text>
    <text class="capi" x="684" y="354">Api\Health</text>
    <circle cx="688" cy="380" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="384">service(name, [&apos;passing&apos; =&gt; true])</text>
    <circle cx="688" cy="402" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="406" style="font-size:8.6px">node(name): semua check pada node</text>
    <circle cx="688" cy="424" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="428" style="font-size:8.6px">checks(name) semua check pada layanan</text>
    <circle cx="688" cy="446" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="450">state() passing / warning / critical</text>
    <circle cx="688" cy="468" r="2.5" fill="#35D07F"/><text class="cl" x="700" y="472" style="font-size:8.6px">Tampilan terpadu heartbeat TTL dan probing eksternal</text>
    <rect x="24" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="516" width="4" height="20" rx="2" fill="#F5A623"/>
    <text class="ct" x="42" y="532" style="font-size:10.1px">Sesi dan distributed lock</text>
    <text class="capi" x="42" y="550">Api\Session + Api\Kv</text>
    <circle cx="46" cy="576" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="580">create(TTL · Behavior · LockDelay)</text>
    <circle cx="46" cy="598" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="602">renew / destroy / info / all / node</text>
    <circle cx="46" cy="620" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="624" style="font-size:9.3px">Kv::put(..., [&apos;acquire&apos; =&gt; id]) untuk mengunci</text>
    <circle cx="46" cy="642" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="646" style="font-size:8.6px">Perilaku delete: sumber daya dilepas otomatis</text>
    <circle cx="46" cy="664" r="2.5" fill="#F5A623"/><text class="cl" x="58" y="668" style="font-size:8.6px">Lock lepas saat sesi kedaluwarsa, tanpa heartbeat</text>

    <rect x="345" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="516" width="4" height="20" rx="2" fill="#F5A623"/>
    <text class="ct" x="363" y="532" style="font-size:13.4px">Izin ACL</text>
    <text class="capi" x="363" y="550">Api\Acl</text>
    <circle cx="367" cy="576" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="580">tokenCreate / Read / Update / Delete</text>
    <circle cx="367" cy="598" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="602" style="font-size:9.8px">Set lengkap policy* / role* / authMethod*</text>
    <circle cx="367" cy="620" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="624">login / logout / bootstrap</text>
    <circle cx="367" cy="642" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="646" style="font-size:8.6px">Token disuntikkan otomatis lewat X-Consul-Token</text>
    <circle cx="367" cy="664" r="2.5" fill="#F5A623"/><text class="cl" x="379" y="668" style="font-size:8.6px">Izin tidak cukup, melempar AccessDeniedException</text>

    <rect x="666" y="492" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="516" width="4" height="20" rx="2" fill="#9BA3FF"/>
    <text class="ct" x="684" y="532" style="font-size:10.1px">Operasional klaster</text>
    <text class="capi" x="684" y="550">Status · Operator · Coordinate · Snapshot · Event</text>
    <circle cx="688" cy="576" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="580" style="font-size:9.2px">Status klaster leader / peers</text>
    <circle cx="688" cy="598" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="602">raftConfig / autopilotConfig</text>
    <circle cx="688" cy="620" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="624">keyring list / install / use / remove</text>
    <circle cx="688" cy="642" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="646" style="font-size:10.4px">Snapshot biner snapshot save / restore</text>
    <circle cx="688" cy="664" r="2.5" fill="#9BA3FF"/><text class="cl" x="700" y="668" style="font-size:8.6px">Koordinat jaringan datacenters / nodes</text>
    <rect x="24" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="24" y="712" width="4" height="20" rx="2" fill="#8B8FE8"/>
    <text class="ct" x="42" y="728" style="font-size:10.1px">Integrasi framework</text>
    <text class="capi" x="42" y="746">src/Integration</text>
    <circle cx="46" cy="772" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="776" style="font-size:10px">Laravel: auto-discovery + Facade + Artisan</text>
    <circle cx="46" cy="794" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="798" style="font-size:10.2px">Hyperf: ConfigProvider + klien coroutine</text>
    <circle cx="46" cy="816" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="820" style="font-size:9.3px">webman: instalasi plugin + onWorkerStart</text>
    <circle cx="46" cy="838" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="842" style="font-size:11.9px">ThinkPHP: ConsulService + app(&apos;consul&apos;)</text>
    <circle cx="46" cy="860" r="2.5" fill="#8B8FE8"/><text class="cl" x="58" y="864" style="font-size:8.6px">API identik, bedanya hanya cara memperoleh $client</text>

    <rect x="345" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="345" y="712" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="ct" x="363" y="728" style="font-size:10.1px">Desain keandalan</text>
    <text class="capi" x="363" y="746">Exception · Logger · Cache · Event · Promise</text>
    <circle cx="367" cy="772" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="776" style="font-size:8.8px">Exception seragam, semua mewarisi ConsulException</text>
    <circle cx="367" cy="794" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="798" style="font-size:8.6px">Log PSR-3, NullLogger sebagai cadangan otomatis</text>
    <circle cx="367" cy="816" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="820" style="font-size:11.4px">Event PSR-14: ConfigChangedEvent</text>
    <circle cx="367" cy="838" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="842" style="font-size:9.4px">ConsulAsyncClient + eksekusi tertunda Promise</text>
    <circle cx="367" cy="860" r="2.5" fill="#35D07F"/><text class="cl" x="379" y="864" style="font-size:10.6px">Error koneksi/decoding → ClientException</text>

    <rect x="666" y="688" width="310" height="178" rx="16" fill="url(#card)" stroke="#2B3145"/>
    <rect x="666" y="712" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="ct" x="684" y="728" style="font-size:10.2px">Fitur inti</text>
    <text class="capi" x="684" y="746">composer require erikwang2013/consul-php</text>
    <circle cx="688" cy="772" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="776" style="font-size:8.6px">PHP 8.0+, paket inti tanpa dependensi framework</text>
    <circle cx="688" cy="794" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="798" style="font-size:9.6px">Mencakup penuh Consul HTTP API v1</text>
    <circle cx="688" cy="816" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="820">11 modul API + 3 wrapper</text>
    <circle cx="688" cy="838" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="842" style="font-size:8.6px">Cukup antarmuka PSR, klien HTTP bisa diganti</text>
    <circle cx="688" cy="860" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="864">309 unit test · PHPStan L5</text>
    <rect x="24" y="886" width="952" height="56" rx="16" fill="#131722" stroke="#262B3A"/>
    <text class="ct" x="44" y="920" style="font-size:10.1px">Satu API, empat framework</text>
    <text class="cl" x="200" y="920" style="font-size:9px">Laravel · Hyperf · webman · ThinkPHP —— paket inti tanpa dependensi, adaptasi framework menyatu, cukup satu composer require</text>
    <text class="capi" x="956" y="920" text-anchor="end">PHP 8.0 – 8.4</text>
  </g>
</svg>
