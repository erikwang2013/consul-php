<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-label="consul-php आर्किटेक्चर डिज़ाइन चित्र">
  <title>consul-php आर्किटेक्चर डिज़ाइन</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .gutter { font-size: 13px; font-weight: 600; fill: #9BA3FF; }
    .ct { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .cs { font-size: 11.5px; fill: #98A1B5; }
    .mini { font-size: 10.5px; fill: #A9B2C3; }
    .band { font-size: 13px; font-weight: 600; fill: #E8ECF5; }
    .bands { font-size: 11px; fill: #98A1B5; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E83E6"/>
      <stop offset="1" stop-color="#E03875"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="990" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="44" y="48">consul-php आर्किटेक्चर डिज़ाइन</text>
    <text class="sub" x="44" y="74">स्तरीय निर्भरता: ऐप परत → इंटीग्रेशन परत → क्लाइंट → हाई-लेवल रैपर → API मॉड्यूल → ट्रांसपोर्ट परत → PSR एब्स्ट्रैक्शन → Consul Agent</text>
    <text class="gutter" x="32" y="140">ऐप परत</text>
    <rect x="122" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="138" y="128">Laravel</text>
    <text class="cs" x="138" y="150">ऑटो-डिस्कवरी + Facade</text>
    <rect x="291" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="307" y="128">Hyperf</text>
    <text class="cs" x="307" y="150">कोरूटीन + एनोटेशन इंजेक्शन</text>
    <rect x="460" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="476" y="128">webman</text>
    <text class="cs" x="476" y="150">प्लगइन ऑटो इंस्टॉल</text>
    <rect x="629" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="645" y="128">ThinkPHP</text>
    <text class="cs" x="645" y="150">Service बाइंडिंग</text>
    <rect x="798" y="96" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="814" y="128">नेटिव PHP</text>
    <text class="cs" x="814" y="150">new ConsulClient()</text>

    <path d="M534 176 L540 187 L546 176" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="234">इंटीग्रेशन परत</text>
    <rect x="122" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="138" y="222">ServiceProvider</text>
    <text class="cs" x="138" y="244">Facade · consul:watch</text>
    <rect x="291" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="307" y="222">ConfigProvider</text>
    <text class="cs" x="307" y="244">कोरूटीन क्लाइंट फ़ैक्टरी</text>
    <rect x="460" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="476" y="222">Webman Install</text>
    <text class="cs" x="476" y="244">कॉन्फ़िग कॉपी + Worker</text>
    <rect x="629" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="645" y="222">ConsulService</text>
    <text class="cs" x="645" y="244">app(&apos;consul&apos;)</text>
    <rect x="798" y="190" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="814" y="222">ClientFactory</text>
    <text class="cs" x="814" y="244">PSR निर्भरता ऑटो-वायरिंग</text>

    <path d="M534 270 L540 281 L546 270" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="328">क्लाइंट</text>
    <rect x="122" y="284" width="413" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="138" y="316">ConsulClient · सिंक एंट्री</text>
    <text class="cs" x="138" y="338">__get मैजिक प्रॉपर्टी वितरण → $client-&gt;kv / health / catalog …</text>
    <rect x="543" y="284" width="413" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="559" y="316">ConsulAsyncClient · Promise डेफ़र्ड एक्ज़ीक्यूशन</text>
    <text class="cs" x="559" y="338">wrap(fn() =&gt; ...)-&gt;then(...)-&gt;catch(...)-&gt;wait()</text>

    <path d="M534 364 L540 375 L546 364" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="430">हाई-लेवल रैपर</text>
    <rect x="122" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="138" y="408">Service\Registry</text>
    <text class="cs" x="138" y="430">register · heartbeat</text>
    <text class="cs" x="138" y="450">heartbeatFail · deregister</text>
    <rect x="403" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="419" y="408">Service\Discovery</text>
    <text class="cs" x="419" y="430">healthyInstances · watch</text>
    <text class="cs" x="419" y="450">LoadBalancer: RoundRobin / Random</text>
    <rect x="684" y="378" width="272" height="92" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="700" y="408">Config\ConfigCenter</text>
    <text class="cs" x="700" y="430">get · namespace · set · delete</text>
    <text class="cs" x="700" y="450">watch() → Config\Watcher हॉट अपडेट</text>

    <path d="M534 474 L540 485 L546 474" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="536">API मॉड्यूल</text>
    <rect x="122" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="164" y="511" text-anchor="middle">Agent</text>
    <rect x="215" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="257" y="511" text-anchor="middle">Catalog</text>
    <rect x="308" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="350" y="511" text-anchor="middle">Health</text>
    <rect x="401" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="443" y="511" text-anchor="middle">Kv</text>
    <rect x="494" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="536" y="511" text-anchor="middle">Session</text>
    <rect x="587" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="629" y="511" text-anchor="middle">Acl</text>
    <rect x="680" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="722" y="511" text-anchor="middle">Event</text>
    <rect x="773" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="815" y="511" text-anchor="middle">Status</text>
    <rect x="866" y="488" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="908" y="511" text-anchor="middle">Coordinate</text>
    <rect x="122" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="164" y="553" text-anchor="middle">Operator</text>
    <rect x="215" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="257" y="553" text-anchor="middle">Snapshot</text>
    <rect x="308" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="350" y="553" text-anchor="middle">Txn</text>
    <rect x="401" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="443" y="553" text-anchor="middle">ConfigEntry</text>
    <rect x="494" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="536" y="553" text-anchor="middle">Connect</text>
    <rect x="587" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="629" y="553" text-anchor="middle">Query</text>
    <rect x="680" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="722" y="553" text-anchor="middle">Peering</text>
    <rect x="773" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="815" y="553" text-anchor="middle" style="font-size:9.7px">DiscoveryChain</text>
    <rect x="866" y="530" width="85" height="36" rx="10" fill="#191E2B" stroke="#2B3145"/>
    <text class="mini" x="908" y="553" text-anchor="middle" style="font-size:9.2px">ExportedService</text>

    <path d="M534 578 L540 589 L546 578" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="640">ट्रांसपोर्ट परत</text>
    <rect x="122" y="592" width="520" height="86" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="138" y="622">TransportInterface ← Psr18Transport</text>
    <text class="cs" x="138" y="644">get / put / post / delete · getRaw / putRaw · getWithHeaders</text>
    <text class="cs" x="138" y="664">X-Consul-Token इंजेक्शन · स्टेटस कोड जाँच · JSON डिकोड · अपवाद मैपिंग</text>
    <rect x="650" y="592" width="306" height="86" rx="14" fill="url(#card)" stroke="#3A4064"/>
    <text class="ct" x="666" y="622">रिस्पॉन्स हेडर कैप्चर</text>
    <text class="cs" x="666" y="644">getWithHeaders() उजागर</text>
    <text class="cs" x="666" y="664">X-Consul-Index → blocking query कर्सर</text>

    <path d="M534 682 L540 693 L546 682" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="738" style="font-size:11px">PSR एब्स्ट्रैक्शन</text>
    <rect x="122" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="138" y="728">PSR-18</text>
    <text class="cs" x="138" y="750">HTTP Client</text>
    <rect x="291" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="307" y="728">PSR-17</text>
    <text class="cs" x="307" y="750" style="font-size:10.6px">Request / Stream Factory</text>
    <rect x="460" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="476" y="728">PSR-16</text>
    <text class="cs" x="476" y="750">Cache (वैकल्पिक)</text>
    <rect x="629" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="645" y="728">PSR-3</text>
    <text class="cs" x="645" y="750">Logger (वैकल्पिक)</text>
    <rect x="798" y="696" width="160" height="76" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="ct" x="814" y="728">PSR-14</text>
    <text class="cs" x="814" y="750">EventDispatcher</text>

    <path d="M534 776 L540 787 L546 776" fill="none" stroke="#5A6288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="gutter" x="32" y="830" style="font-size:12.9px">क्लस्टर बैकएंड</text>
    <rect x="122" y="790" width="834" height="72" rx="14" fill="#141826" stroke="#41476B"/>
    <rect x="122" y="790" width="6" height="72" rx="3" fill="url(#accent)"/>
    <text class="ct" x="148" y="822">Consul Agent · HTTP API v1 /agent /catalog /health /kv /session /acl /operator</text>
    <text class="cs" x="148" y="844">लोकल Agent फ़ॉरवर्ड → Consul Server क्लस्टर (Raft सहमति · मल्टी-डेटासेंटर · ACL)</text>
    <rect x="24" y="878" width="952" height="88" rx="16" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="890" width="4" height="18" rx="2" fill="#8B8FE8"/>
    <text class="band" x="58" y="904">क्रॉस-कटिंग पहलू</text>
    <text class="bands" x="44" y="928">अपवाद प्रणाली: ConsulException → Client / Server / Request(401·403·404)</text>
    <text class="bands" x="500" y="928">PSR-16 कैश: get() / namespace() ऑटो पढ़ें-लिखें</text>
    <text class="bands" x="44" y="950">PSR-3 लॉग: NullLogger फ़ॉलबैक</text>
    <text class="bands" x="500" y="950">गुणवत्ता: PHP 8.0–8.4 · PHPStan L5 · 594 टेस्ट</text>
  </g>
</svg>
