<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-label="consul-php जीवनचक्र चित्र">
  <title>consul-php जीवनचक्र: सेवा इंस्टेंस · कॉन्फ़िग हॉट अपडेट · एकल request</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .lt { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .chip { font-size: 11px; fill: #8B93A7; }
    .bt { font-size: 12.5px; font-weight: 600; fill: #E8ECF5; }
    .bs { font-size: 10.5px; fill: #98A1B5; }
    .al { font-size: 10.5px; fill: #8B93A7; }
    .note { font-size: 11px; fill: #6E768A; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6288"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#35D07F"/>
    </marker>
  </defs>

  <rect width="1000" height="990" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="24" y="48">consul-php जीवनचक्र</text>
    <text class="sub" x="24" y="74" style="font-size:9.4px">तीन मुख्य जीवनचक्र: सेवा इंस्टेंस स्थिति बदलाव · कॉन्फ़िग हॉट अपडेट (लॉन्ग पोलिंग और डाउनग्रेड रिकवरी) · एकल request प्रोसेसिंग</text>
    <rect x="24" y="100" width="952" height="232" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="120" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="lt" x="58" y="136" style="font-size:13.4px">① सेवा इंस्टेंस जीवनचक्र · Service\Registry</text>
    <text class="chip" x="956" y="136" text-anchor="end">register → heartbeat → deregister</text>

    <rect x="24" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="99" y="214" text-anchor="middle" style="font-size:11.4px">अपंजीकृत</text>
    <text class="bs" x="99" y="236" text-anchor="middle" style="font-size:9px">सेवा Consul कैटलॉग में नहीं</text>

    <rect x="224" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="299" y="214" text-anchor="middle" fill="#7FE3B0" style="font-size:12.1px">passing स्वस्थ</text>
    <text class="bs" x="299" y="236" text-anchor="middle" style="font-size:7.6px">TTL heartbeat सामान्य</text>
    <text class="bs" x="299" y="252" text-anchor="middle" style="font-size:7.6px">सेवा खोज द्वारा चुना जा सके</text>
    <path d="M274 180 C274 158 324 158 324 180" fill="none" stroke="#35D07F" stroke-width="2" marker-end="url(#arg)"/>
    <text class="al" x="299" y="154" text-anchor="middle" fill="#5FBF92" style="font-size:10.3px">heartbeat() रिन्यू</text>

    <rect x="424" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#F5A623" stroke-width="1.5"/>
    <text class="bt" x="499" y="214" text-anchor="middle" fill="#F7C066" style="font-size:10.4px">warning चेतावनी</text>
    <text class="bs" x="499" y="236" text-anchor="middle" style="font-size:7.6px">जाँच ने असामान्य स्थिति दी</text>
    <text class="bs" x="499" y="252" text-anchor="middle" style="font-size:7.6px">कैटलॉग में है, ज़रूरत पर फ़िल्टर करें</text>

    <rect x="624" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#FF5C5C" stroke-width="1.5"/>
    <text class="bt" x="699" y="214" text-anchor="middle" fill="#FF8F8F" style="font-size:12.2px">critical गंभीर</text>
    <text class="bs" x="699" y="236" text-anchor="middle" style="font-size:7.6px">heartbeat टाइमआउट / जाँच विफल</text>
    <text class="bs" x="699" y="252" text-anchor="middle" style="font-size:8.5px">healthyInstances अब नहीं लौटाता</text>

    <rect x="824" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="899" y="214" text-anchor="middle" style="font-size:9px">डीरजिस्टर्ड</text>
    <text class="bs" x="899" y="236" text-anchor="middle" style="font-size:7.6px">सुचारु ऑफ़लाइन या ऑटो क्लीनअप</text>

    <path d="M174 225 H220" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="197" y="212" text-anchor="middle">register()</text>
    <path d="M374 225 H420" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="397" y="212" text-anchor="middle" style="font-size:7.6px">जाँच चेतावनी</text>
    <path d="M574 225 H620" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="597" y="212" text-anchor="middle" style="font-size:7.6px">heartbeat टाइमआउट</text>
    <path d="M774 225 H820" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="797" y="212" text-anchor="middle" style="font-size:7.6px">ऑटो या सक्रिय डीरजिस्टर</text>

    <path d="M699 270 V 310 H 303 V 274" fill="none" stroke="#35D07F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arg)"/>
    <text class="al" x="500" y="304" text-anchor="middle" fill="#5FBF92" style="font-size:8.8px">heartbeat() सामान्य → वापस passing, दोबारा रजिस्टर की ज़रूरत नहीं</text>
    <rect x="24" y="352" width="952" height="320" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="372" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="lt" x="58" y="388" style="font-size:11.8px">② कॉन्फ़िग हॉट अपडेट जीवनचक्र · Config\Watcher</text>
    <text class="chip" x="956" y="388" text-anchor="end" style="font-size:7.9px">blocking query प्राथमिक, त्रुटि पर ऑटो डाउनग्रेड और रिकवरी</text>

    <rect x="24" y="406" width="150" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="99" y="432" text-anchor="middle">① watch(prefix)</text>
    <text class="bs" x="99" y="452" text-anchor="middle" style="font-size:7.6px">निगरानी शुरू</text>

    <rect x="200" y="406" width="330" height="64" rx="14" fill="url(#card)" stroke="#E03875" stroke-width="1.5"/>
    <text class="bt" x="365" y="432" text-anchor="middle" fill="#F58FB4" style="font-size:9.6px">② blocking query ब्लॉकिंग लॉन्ग पोलिंग</text>
    <text class="bs" x="365" y="452" text-anchor="middle" style="font-size:8.7px">डिफ़ॉल्ट 30s टाइमआउट, X-Consul-Index कर्सर के साथ</text>

    <rect x="556" y="406" width="170" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="641" y="432" text-anchor="middle" style="font-size:9px">③ परिवर्तन पहचान</text>
    <text class="bs" x="641" y="452" text-anchor="middle" style="font-size:8.4px">index आगे बढ़े + स्नैपशॉट तुलना</text>

    <rect x="752" y="406" width="224" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="864" y="432" text-anchor="middle" style="font-size:11.9px">④ सूचना ↺</text>
    <text class="bs" x="864" y="452" text-anchor="middle" style="font-size:10.2px">onChange कॉलबैक + PSR-14 इवेंट</text>

    <path d="M174 438 H196" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M530 438 H552" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M726 438 H748" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="864" y="494" text-anchor="middle" style="font-size:10.5px">बदलाव नहीं तो index आगे, वापस ②</text>

    <path d="M250 470 V 532" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="262" y="506" style="font-size:8.8px">blocking विफल / टाइमआउट</text>

    <rect x="214" y="536" width="200" height="64" rx="14" fill="url(#card)" stroke="#F5A623" stroke-width="1.5"/>
    <text class="bt" x="314" y="562" text-anchor="middle" fill="#F7C066" style="font-size:9px">⑤ नियमित पोलिंग पर डाउनग्रेड</text>
    <text class="bs" x="314" y="582" text-anchor="middle" style="font-size:9.6px">डिफ़ॉल्ट 10s, setPollInterval()</text>

    <rect x="440" y="536" width="200" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="540" y="562" text-anchor="middle" style="font-size:10.4px">⑥ लगातार 5 सफलताएँ</text>
    <text class="bs" x="540" y="582" text-anchor="middle">काउंटर पूरा</text>

    <rect x="666" y="536" width="260" height="64" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="796" y="562" text-anchor="middle" fill="#7FE3B0" style="font-size:9px">⑦ blocking query ऑटो बहाल ↺</text>
    <text class="bs" x="796" y="582" text-anchor="middle" style="font-size:8.7px">② पर वापस, काउंटर शून्य</text>

    <path d="M414 568 H436" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M640 568 H662" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="note" x="44" y="640" style="font-size:7.9px">stop() किसी भी चरण में अन्य प्रोसेस / कोरूटीन से कॉल करके निगरानी सुचारु रूप से बंद करता है; कैश और निगरानी चैनल अलग हैं, Watcher हमेशा Consul का रीयल-टाइम मान पढ़ता है।</text>
    <rect x="24" y="692" width="952" height="274" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="712" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="lt" x="58" y="728" style="font-size:12.7px">③ एकल request जीवनचक्र · Api → Transport → PSR-18</text>
    <text class="chip" x="956" y="728" text-anchor="end" style="font-size:8.6px">सिंक कॉल, एक राउंड ट्रिप</text>

    <rect x="24" y="744" width="200" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="124" y="770" text-anchor="middle">① $client-&gt;kv-&gt;get()</text>
    <text class="bs" x="124" y="790" text-anchor="middle" style="font-size:7.6px">कॉलर द्वारा शुरू</text>

    <rect x="250" y="744" width="190" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="345" y="770" text-anchor="middle" style="font-size:11.2px">② __get वितरण</text>
    <text class="bs" x="345" y="790" text-anchor="middle" style="font-size:7.6px">मॉड्यूल इंस्टैंशिएट और पुनः उपयोग</text>

    <rect x="466" y="744" width="300" height="56" rx="14" fill="url(#card)" stroke="#4CC9F0" stroke-width="1.5"/>
    <text class="bt" x="616" y="770" text-anchor="middle" fill="#8FDCF7" style="font-size:9.5px">③ Psr18Transport request बनाता है</text>
    <text class="bs" x="616" y="790" text-anchor="middle">RequestFactory + StreamFactory (PSR-17)</text>

    <rect x="792" y="744" width="184" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="884" y="770" text-anchor="middle" style="font-size:12.1px">④ Token इंजेक्ट</text>
    <text class="bs" x="884" y="790" text-anchor="middle">X-Consul-Token</text>

    <path d="M224 772 H246" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M440 772 H462" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M766 772 H788" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <path d="M884 800 V 818 H 124 V 834" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="24" y="838" width="200" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="124" y="864" text-anchor="middle" style="font-size:11.2px">⑤ HTTP request भेजें</text>
    <text class="bs" x="124" y="884" text-anchor="middle">Guzzle / Swoole / कस्टम · PSR-18</text>

    <rect x="250" y="838" width="170" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="335" y="864" text-anchor="middle" style="font-size:9.9px">⑥ स्टेटस कोड जाँच</text>
    <text class="bs" x="335" y="884" text-anchor="middle" style="font-size:10.2px">4xx / 5xx शाखा</text>

    <rect x="446" y="838" width="276" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="584" y="864" text-anchor="middle" style="font-size:11.1px">⑦ JSON डिकोड</text>
    <text class="bs" x="584" y="884" text-anchor="middle" style="font-size:8.2px">getRaw सीधे रॉ बाइट लौटाता है (Snapshot)</text>

    <rect x="748" y="838" width="228" height="56" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="862" y="864" text-anchor="middle" fill="#7FE3B0" style="font-size:11.7px">⑧ array | string रिटर्न</text>
    <text class="bs" x="862" y="884" text-anchor="middle" style="font-size:9.5px">उच्च परत के रैपर को सौंपें</text>

    <path d="M224 866 H246" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M420 866 H442" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M722 866 H744" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <text class="note" x="44" y="924" style="font-size:10.6px">अपवाद शाखाएँ: 401 → UnauthorizedException · 403 → AccessDeniedException · 404 → NotFoundException</text>
    <text class="note" x="44" y="944" style="font-size:10.6px">　　　　　5xx → ServerException · कनेक्शन / डिकोड विफल → ClientException (बाकी 4xx → ConsulRequestException)</text>
  </g>
</svg>
