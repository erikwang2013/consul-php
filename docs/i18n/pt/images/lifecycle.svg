<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-label="Diagrama do ciclo de vida do consul-php">
  <title>Ciclo de vida do consul-php: instância de serviço · hot reload de configuração · requisição individual</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h1 { font-size: 24px; font-weight: 700; fill: #EDF0F7; }
    .sub { font-size: 13px; fill: #8B93A7; }
    .lt { font-size: 14px; font-weight: 600; fill: #E8ECF5; }
    .chip { font-size: 11px; fill: #8B93A7; }
    .bt { font-size: 12.5px; font-weight: 600; fill: #E8ECF5; }
    .bs { font-size: 10.5px; fill: #98A1B5; }
    .al { font-size: 10.5px; fill: #8B93A7; }
    .note { font-size: 11px; fill: #6E768A; }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2030"/>
      <stop offset="1" stop-color="#161A26"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6288"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#35D07F"/>
    </marker>
  </defs>

  <rect width="1000" height="990" fill="#0F1117"/>
  <g class="t">
    <text class="h1" x="24" y="48">Ciclo de vida do consul-php</text>
    <text class="sub" x="24" y="74" style="font-size:10.1px">Três ciclos de vida essenciais: transição de estado da instância de serviço · hot reload de configuração (long polling e recuperação após degradação) · fluxo de processamento de uma requisição</text>
    <rect x="24" y="100" width="952" height="232" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="120" width="4" height="20" rx="2" fill="#35D07F"/>
    <text class="lt" x="58" y="136">① Ciclo de vida da instância de serviço · Service\Registry</text>
    <text class="chip" x="956" y="136" text-anchor="end">register → heartbeat → deregister</text>

    <rect x="24" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="99" y="214" text-anchor="middle">Não registrado</text>
    <text class="bs" x="99" y="236" text-anchor="middle" style="font-size:7.2px">Serviço não está no catálogo do Consul</text>

    <rect x="224" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="299" y="214" text-anchor="middle" fill="#7FE3B0">passing (saudável)</text>
    <text class="bs" x="299" y="236" text-anchor="middle">Heartbeat TTL normal</text>
    <text class="bs" x="299" y="252" text-anchor="middle">Elegível pela descoberta</text>
    <path d="M274 180 C274 158 324 158 324 180" fill="none" stroke="#35D07F" stroke-width="2" marker-end="url(#arg)"/>
    <text class="al" x="299" y="154" text-anchor="middle" fill="#5FBF92">heartbeat() renova</text>

    <rect x="424" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#F5A623" stroke-width="1.5"/>
    <text class="bt" x="499" y="214" text-anchor="middle" fill="#F7C066">warning (alerta)</text>
    <text class="bs" x="499" y="236" text-anchor="middle" style="font-size:6.9px">A verificação retorna um estado anormal</text>
    <text class="bs" x="499" y="252" text-anchor="middle">Permanece no catálogo</text>

    <rect x="624" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#FF5C5C" stroke-width="1.5"/>
    <text class="bt" x="699" y="214" text-anchor="middle" fill="#FF8F8F">critical (crítico)</text>
    <text class="bs" x="699" y="236" text-anchor="middle" style="font-size:6.6px">Timeout de heartbeat / falha na sondagem</text>
    <text class="bs" x="699" y="252" text-anchor="middle" style="font-size:8.1px">healthyInstances deixa de retornar</text>

    <rect x="824" y="180" width="150" height="90" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="899" y="214" text-anchor="middle">Desregistrado</text>
    <text class="bs" x="899" y="236" text-anchor="middle" style="font-size:7.4px">Saída graciosa ou limpeza automática</text>

    <path d="M174 225 H220" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="197" y="174" text-anchor="middle">register()</text>
    <path d="M374 225 H420" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="397" y="174" text-anchor="middle">verificação em alerta</text>
    <path d="M574 225 H620" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="597" y="174" text-anchor="middle">Timeout de heartbeat</text>
    <path d="M774 225 H820" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="797" y="174" text-anchor="middle">Desregistro automático ou manual</text>

    <path d="M699 270 V 310 H 303 V 274" fill="none" stroke="#35D07F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arg)"/>
    <text class="al" x="500" y="304" text-anchor="middle" fill="#5FBF92">heartbeat() volta ao normal → retorna a passing, sem registrar de novo</text>
    <rect x="24" y="352" width="952" height="320" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="372" width="4" height="20" rx="2" fill="#E03875"/>
    <text class="lt" x="58" y="388">② Ciclo de vida do hot reload de configuração · Config\Watcher</text>
    <text class="chip" x="956" y="388" text-anchor="end">blocking query como prioridade, com degradação e recuperação automáticas em caso de falha</text>

    <rect x="24" y="406" width="150" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="99" y="432" text-anchor="middle">① watch(prefix)</text>
    <text class="bs" x="99" y="452" text-anchor="middle">inicia o monitoramento</text>

    <rect x="200" y="406" width="330" height="64" rx="14" fill="url(#card)" stroke="#E03875" stroke-width="1.5"/>
    <text class="bt" x="365" y="432" text-anchor="middle" fill="#F58FB4">② blocking query com long polling bloqueante</text>
    <text class="bs" x="365" y="452" text-anchor="middle">Timeout de 30s por padrão, com o cursor X-Consul-Index</text>

    <rect x="556" y="406" width="170" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="641" y="432" text-anchor="middle">③ detecção de mudanças</text>
    <text class="bs" x="641" y="452" text-anchor="middle" style="font-size:7.3px">avanço do index + comparação de snapshot</text>

    <rect x="752" y="406" width="224" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="864" y="432" text-anchor="middle">④ notificação ↺</text>
    <text class="bs" x="864" y="452" text-anchor="middle">callback onChange + eventos PSR-14</text>

    <path d="M174 438 H196" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M530 438 H552" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M726 438 H748" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="864" y="494" text-anchor="middle" style="font-size:9.7px">Sem mudanças, o index avança e volta ao ②</text>

    <path d="M250 470 V 532" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="al" x="262" y="506">Falha / timeout do blocking</text>

    <rect x="214" y="536" width="200" height="64" rx="14" fill="url(#card)" stroke="#F5A623" stroke-width="1.5"/>
    <text class="bt" x="314" y="562" text-anchor="middle" fill="#F7C066" style="font-size:10.6px">⑤ degradação para polling periódico</text>
    <text class="bs" x="314" y="582" text-anchor="middle">10s por padrão, setPollInterval()</text>

    <rect x="440" y="536" width="200" height="64" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="540" y="562" text-anchor="middle">⑥ 5 sucessos consecutivos</text>
    <text class="bs" x="540" y="582" text-anchor="middle">Contador atinge o limite</text>

    <rect x="666" y="536" width="260" height="64" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="796" y="562" text-anchor="middle" fill="#7FE3B0" style="font-size:9.5px">⑦ recuperação automática da consulta bloqueante ↺</text>
    <text class="bs" x="796" y="582" text-anchor="middle">Volta ao ②, contador zerado</text>

    <path d="M414 568 H436" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M640 568 H662" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <text class="note" x="44" y="640" style="font-size:7.6px">stop() pode ser chamado a qualquer momento por outro processo / corrotina para encerrar o monitoramento de forma graciosa; o canal de cache é separado do canal de monitoramento, e o Watcher sempre lê os valores em tempo real do Consul.</text>
    <rect x="24" y="692" width="952" height="274" rx="18" fill="#131722" stroke="#262B3A"/>
    <rect x="44" y="712" width="4" height="20" rx="2" fill="#4CC9F0"/>
    <text class="lt" x="58" y="728">③ Ciclo de vida de uma requisição · Api → Transport → PSR-18</text>
    <text class="chip" x="956" y="728" text-anchor="end">Chamada síncrona, uma única ida e volta</text>

    <rect x="24" y="744" width="200" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="124" y="770" text-anchor="middle">① $client-&gt;kv-&gt;get()</text>
    <text class="bs" x="124" y="790" text-anchor="middle">Iniciado pelo chamador</text>

    <rect x="250" y="744" width="190" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="345" y="770" text-anchor="middle">② distribuição via __get</text>
    <text class="bs" x="345" y="790" text-anchor="middle">módulo instanciado e reutilizado</text>

    <rect x="466" y="744" width="300" height="56" rx="14" fill="url(#card)" stroke="#4CC9F0" stroke-width="1.5"/>
    <text class="bt" x="616" y="770" text-anchor="middle" fill="#8FDCF7">③ Psr18Transport monta a requisição</text>
    <text class="bs" x="616" y="790" text-anchor="middle">RequestFactory + StreamFactory (PSR-17)</text>

    <rect x="792" y="744" width="184" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="884" y="770" text-anchor="middle">④ injeção do Token</text>
    <text class="bs" x="884" y="790" text-anchor="middle">X-Consul-Token</text>

    <path d="M224 772 H246" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M440 772 H462" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M766 772 H788" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <path d="M884 800 V 818 H 124 V 834" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="24" y="838" width="200" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="124" y="864" text-anchor="middle">⑤ envio da requisição HTTP</text>
    <text class="bs" x="124" y="884" text-anchor="middle" style="font-size:9.5px">Guzzle / Swoole / personalizado · PSR-18</text>

    <rect x="250" y="838" width="170" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="335" y="864" text-anchor="middle" style="font-size:9.7px">⑥ verificação do código de status</text>
    <text class="bs" x="335" y="884" text-anchor="middle">ramificações 4xx / 5xx</text>

    <rect x="446" y="838" width="276" height="56" rx="14" fill="url(#card)" stroke="#2B3145"/>
    <text class="bt" x="584" y="864" text-anchor="middle">⑦ decodificação JSON</text>
    <text class="bs" x="584" y="884" text-anchor="middle" style="font-size:9.6px">getRaw retorna os bytes brutos diretamente (Snapshot)</text>

    <rect x="748" y="838" width="228" height="56" rx="14" fill="url(#card)" stroke="#35D07F" stroke-width="1.5"/>
    <text class="bt" x="862" y="864" text-anchor="middle" fill="#7FE3B0">⑧ retorna array | string</text>
    <text class="bs" x="862" y="884" text-anchor="middle" style="font-size:9.7px">Segue para o wrapper de alto nível processar</text>

    <path d="M224 866 H246" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M420 866 H442" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M722 866 H744" fill="none" stroke="#5A6288" stroke-width="2" marker-end="url(#ar)"/>

    <text class="note" x="44" y="924">Ramificações de exceção: 401 → UnauthorizedException · 403 → AccessDeniedException · 404 → NotFoundException</text>
    <text class="note" x="44" y="944">　　　　　5xx → ServerException · falha de conexão / decodificação → ClientException (demais 4xx → ConsulRequestException)</text>
  </g>
</svg>
