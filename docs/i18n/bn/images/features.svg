<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-label="consul-php ফিচার ডিজাইন চিত্র">
  <title>consul-php ফিচার ডিজাইন</title>
  <style>
