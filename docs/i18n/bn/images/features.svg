    <circle cx="688" cy="772" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="776">PHP 8.0+, কোর প্যাকেজে ফ্রেমওয়ার্ক নির্ভরতা শূন্য</text>
    <circle cx="688" cy="794" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="798">Consul HTTP API v1 সম্পূর্ণ কভার</text>
    <circle cx="688" cy="816" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="820">11টি API মডিউল + 3টি হাই-লেভেল র্যাপার</text>
    <circle cx="688" cy="838" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="842">শুধু PSR ইন্টারফেসের উপর নির্ভর, HTTP ক্লায়েন্ট বদলানো যায়</text>
    <circle cx="688" cy="860" r="2.5" fill="#4CC9F0"/><text class="cl" x="700" y="864">309টি ইউনিট টেস্ট · PHPStan L5</text>
