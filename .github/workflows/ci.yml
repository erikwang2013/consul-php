name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
      # 默认 128M 内存下并行分析会静默产出"分析不完整"的结果，显式抬高
      - run: vendor/bin/phpstan analyse --memory-limit=1G

      # 改了 docs/images/ 或生成器却忘了重新生成 12 种语言的图，这里会红
      - name: i18n 生成一致性
        run: php scripts/i18n-svg.php build all && git diff --exit-code -- docs/i18n
      - name: i18n 校验
        run: php scripts/i18n-svg.php verify all
      - name: i18n 版面审计（译文不得溢出卡片）
        run: php scripts/i18n-svg.php audit all
