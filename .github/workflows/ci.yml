name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse

      # 改了 docs/images/ 或生成器却忘了重新生成 12 种语言的图，这里会红
      - name: i18n 生成一致性
        run: php scripts/i18n-svg.php build all && git diff --exit-code -- docs/i18n
      - name: i18n 校验
        run: php scripts/i18n-svg.php verify all
      - name: i18n 版面审计（译文不得溢出卡片）
        run: php scripts/i18n-svg.php audit all
